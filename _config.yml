# Strings 博客配置
title: Strings
subtitle: 机器学习、风控算法与阅读思考
description: hello，各位好，这里记录机器学习、风控算法与阅读思考。
keywords: [机器学习, 风控算法, 数据科学, 阅读]
author: Lixin
language: zh-CN
timezone: Asia/Shanghai

url: https://stringsli.github.io/
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

index_generator:
  path: ''
  per_page: 8
  order_by: -date

default_category: 未分类
category_map:
tag_map:

meta_generator: false
date_format: YYYY-MM-DD
time_format: HH:mm
use_date_for_updated: false
per_page: 8
pagination_dir: page

include:
exclude:
ignore:

theme: strings

search:
  path: search.json
  field: post

# GitHub Pages 由 .github/workflows/deploy.yml 发布。
deploy:
  type: ''